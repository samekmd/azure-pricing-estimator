[project]
name = "azure-pricing-estimator"
version = "0.1.0"
description = "Estimador de preços do Azure com autenticação via Entra ID (MSAL)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "msal>=1.37.0",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["mcp-server/tests"]
asyncio_mode = "auto"
markers = [
    "integration: testes que batem na API real (pulados sem rede)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp-server/src/azure_estimator_mcp"]
